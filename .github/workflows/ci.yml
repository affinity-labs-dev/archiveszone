name: CI

# Pull requests only. Pushes to main run the same two checks in pages.yml, where
# they gate the deploy itself — a bad push there fails before it can reach
# archiveszone.app, which is strictly stronger than failing after. Duplicating
# the push trigger here would just run everything twice.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both scripts are dependency-free and use the runner's preinstalled
      # python3, so there is nothing to install and nothing to build. This repo
      # is deployed static output; there is no build step by design.

      - name: Standalone pages are linked from every page
        run: python3 tools/check-links.py

      - name: Tracking tags present and correctly ordered
        # index/404 mirror, and fv.js -> t.js -> ph.js on every funnel page.
        run: python3 tools/check-tracking.py
