name: CI

# Pull requests are the obvious half. Pushes to main are the important half:
# this repo has historically received `Deploy <sha>` commits from a bot pushing
# a full static build straight to main, which on 2026-08-06 reverted three PRs
# without anyone noticing. A workflow that only ran on pull_request would not
# have seen it. This one goes red within a minute of a bad push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both scripts are dependency-free and use the runner's preinstalled
      # python3, so there is nothing to install and nothing to build. This repo
      # is deployed static output; there is no build step by design.

      - name: Shared navbar and footer are in sync
        # 18 copies of the chrome (17 pages + the React chunk) with nothing
        # keeping them in sync. Also catches a react-router Link pointing at a
        # page that is not a route, which renders the SPA 404 for real users
        # while looking completely fine in the HTML.
        run: python3 tools/sync-nav-footer.py

      - name: Tracking tags present and correctly ordered
        # index/404 mirror, and fv.js -> t.js -> ph.js on every funnel page.
        run: python3 tools/check-tracking.py
