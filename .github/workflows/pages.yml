name: Deploy to GitHub Pages

# Replaces the `pages build and deployment` workflow GitHub generates for the
# "Deploy from a branch" source.
#
# Since 2026-08-06 the Pages backend has needed more than 10 minutes to publish
# this site, having done it in 2m09s that morning. `actions/deploy-pages` gives
# up at 10 minutes and CANNOT be told to wait longer — its `timeout` input is
# capped, and a larger value is clamped with:
#
#   Warning: timeout value is greater than the allowed maximum
#   - timeout set to the maximum of 600000 milliseconds.
#
# So the action's verdict is not evidence about the site, in either direction.
# It failed at 11:40 and production did not update; it failed at 14:28 and
# production updated three minutes later, because the "cancel" it issues does
# not stop an in-flight deployment. Trusting it means either missing a real
# failure or crying wolf on every success.
#
# This workflow therefore lets the deploy step give up (continue-on-error) and
# decides the outcome by asking the origin what it is actually serving. See
# tools/verify-live.py.
#
# REQUIRES Settings -> Pages -> Source set to "GitHub Actions". With the source
# still on "Deploy from a branch" the deploy step fails fast, because Pages will
# not accept an Actions-built artifact for a branch-sourced site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment already in flight — a half-published site is worse
# than a late one. Queued runs wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Production gate. This is deliberately a dependency of deploy rather than a
  # parallel job: a push that reverts the shared chrome or the tracking tags
  # fails here and never reaches archiveszone.app. The Deploy bot's 2026-08-06
  # push, which reverted three merged PRs, would have been stopped here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared navbar and footer are in sync
        run: python3 tools/sync-nav-footer.py
      - name: Tracking tags present and correctly ordered
        run: python3 tools/check-tracking.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Package the site
        # The repo root IS the site — no build step, by design (AGENTS.md).
        # .git is excluded by the action itself.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        # NOT the source of truth for whether this worked — see the header. Its
        # 10-minute give-up is expected on this site right now, and Pages
        # usually finishes a few minutes later regardless. The verify step
        # below decides. Do not "fix" this by raising `timeout`: the action
        # clamps anything above 600000ms.
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Tolerate transient status-polling errors instead of failing early.
          error_count: 10

      - name: Verify the site is actually serving this commit
        # The real gate. Polls the origin (cache-busted) until what it serves
        # matches this checkout, and fails the job if it never does. This is
        # what turns a green tick into a claim about production rather than a
        # claim about an action's patience.
        run: python3 tools/verify-live.py --timeout 1500
